copy_on_select yes
scrollback_lines 10000
enable_audio_bell no
strip_trailing_spaces always
repaint_delay 10
input_delay 3
sync_to_monitor yes
# Confirm before closing a tab/OS window holding 2+ windows (cmd+w accidents)
confirm_os_window_close 2
enabled_layouts stack,tall,fat,grid,horizontal,vertical,splits

# Tab index + window count, since stack layout hides the other windows
tab_title_template "{index}:{title} [{num_windows}]"

## Keymaps
map cmd+q no_op

# Open new window/tab/os-window in the same folder as the current window
map ctrl+shift+enter launch --cwd=current --location=last
map ctrl+shift+t launch --type=tab --cwd=current
map ctrl+shift+n launch --type=os-window --cwd=current

# Cycle through all enabled layouts
map ctrl+shift+l next_layout

# Reload kitty config
map ctrl+shift+r load_config_file

# Focus a window directly by its position
map ctrl+shift+1 first_window
map ctrl+shift+2 second_window
map ctrl+shift+3 third_window
map ctrl+shift+4 fourth_window
map ctrl+shift+5 fifth_window
map ctrl+shift+6 sixth_window
map ctrl+shift+7 seventh_window
map ctrl+shift+8 eighth_window
map ctrl+shift+9 ninth_window

# Focus a tab directly by its number (cmd+0 = last-active tab)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab 0

